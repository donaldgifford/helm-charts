---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "chartdb.fullname" . }}-test-connection
  labels:
    {{- include "chartdb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: connection-test
      image: curlimages/curl:latest
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - curl -fsS --max-time 10 http://{{ include "chartdb.fullname" . }}:{{ .Values.chartdb.service.port }}/
