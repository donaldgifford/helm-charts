{{- if and .Values.chartdb.httpRoute.enabled (gt (len .Values.chartdb.httpRoute.parentRefs) 0) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chartdb.fullname" . }}
  labels:
    {{- include "chartdb.labels" . | nindent 4 }}
  {{- with .Values.chartdb.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.chartdb.httpRoute.parentRefs | nindent 4 }}
  {{- if .Values.chartdb.httpRoute.hostname }}
  hostnames:
    - {{ .Values.chartdb.httpRoute.hostname | quote }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "chartdb.fullname" . }}
          port: {{ .Values.chartdb.service.port }}
{{- end }}
