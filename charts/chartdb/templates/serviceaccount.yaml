{{- if .Values.chartdb.serviceAccount.create -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chartdb.serviceAccountName" . }}
  labels:
    {{- include "chartdb.labels" . | nindent 4 }}
  {{- with .Values.chartdb.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.chartdb.serviceAccount.automountServiceAccountToken }}
{{- end }}
