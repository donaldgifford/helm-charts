---
suite: service
templates:
  - templates/service.yaml
tests:
  - it: renders a Service
    asserts:
      - isKind:
          of: Service

  - it: uses ClusterIP by default
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: exposes port 80 by default
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[0].protocol
          value: TCP

  - it: sets port from chartdb.service.port
    set:
      chartdb:
        service:
          port: 8080
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: switches service type
    set:
      chartdb:
        service:
          type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: selector matches the chartdb pod labels
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: chartdb
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
