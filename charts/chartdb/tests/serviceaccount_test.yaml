---
suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: renders ServiceAccount when create is true
    set:
      chartdb:
        serviceAccount:
          create: true
    asserts:
      - isKind:
          of: ServiceAccount

  - it: does not render when create is false
    set:
      chartdb:
        serviceAccount:
          create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: disables automount by default
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: sets annotations from values
    set:
      chartdb:
        serviceAccount:
          create: true
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::role/chartdb
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::role/chartdb

  - it: overrides ServiceAccount name when set
    set:
      chartdb:
        serviceAccount:
          create: true
          name: my-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-sa
