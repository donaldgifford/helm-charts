---
suite: service
templates:
  - templates/service.yaml
tests:
  - it: renders a Service
    asserts:
      - isKind:
          of: Service

  - it: uses ClusterIP by default
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: sets port from service.port
    set:
      service:
        port: 9090
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9090

  - it: sets service type
    set:
      service:
        type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
