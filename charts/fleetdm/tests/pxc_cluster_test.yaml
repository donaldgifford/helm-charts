---
suite: pxc-cluster
templates:
  - templates/pxc-cluster.yaml
tests:
  - it: renders PerconaXtraDBCluster when pxc.enabled
    set:
      pxc:
        enabled: true
    asserts:
      - isKind:
          of: PerconaXtraDBCluster

  - it: does not render when pxc.enabled is false
    set:
      pxc:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: sets cluster name from pxc.clusterName
    set:
      pxc:
        enabled: true
        clusterName: my-pxc
    asserts:
      - equal:
          path: metadata.name
          value: my-pxc

  - it: sets pxc.size from values
    set:
      pxc:
        enabled: true
        size: 5
    asserts:
      - equal:
          path: spec.pxc.size
          value: 5

  - it: uses generated secret name by default
    set:
      pxc:
        enabled: true
        existingSecret: ""
    asserts:
      - equal:
          path: spec.secretsName
          value: RELEASE-NAME-fleetdm-pxc

  - it: uses existingSecret when set
    set:
      pxc:
        enabled: true
        existingSecret: my-pxc-secret
    asserts:
      - equal:
          path: spec.secretsName
          value: my-pxc-secret

  - it: enables haproxy by default
    set:
      pxc:
        enabled: true
    asserts:
      - equal:
          path: spec.haproxy.enabled
          value: true

  - it: includes ArgoCD server-side apply annotation
    set:
      pxc:
        enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "ServerSideApply=true"

  - it: omits backup when disabled
    set:
      pxc:
        enabled: true
        backup:
          enabled: false
    asserts:
      - isNull:
          path: spec.backup

  - it: fails when pxc.size < 3 and allowUnsafe is false
    set:
      pxc:
        enabled: true
        size: 1
        allowUnsafe: false
    asserts:
      - failedTemplate:
          errorMessage: "pxc.size must be >= 3 for production use. Set pxc.allowUnsafe: true to allow single-node PXC (dev/test only)."

  - it: fails when haproxy.size < 2 and allowUnsafe is false
    set:
      pxc:
        enabled: true
        size: 3
        allowUnsafe: false
        haproxy:
          enabled: true
          size: 1
          image:
            repository: percona/haproxy
            tag: "2.8.5"
    asserts:
      - failedTemplate:
          errorMessage: "pxc.haproxy.size must be >= 2 for production use. Set pxc.allowUnsafe: true to allow single-replica HAProxy (dev/test only)."

  - it: allows pxc.size 1 when allowUnsafe is true
    set:
      pxc:
        enabled: true
        size: 1
        allowUnsafe: true
    asserts:
      - equal:
          path: spec.pxc.size
          value: 1
      - equal:
          path: spec.unsafeFlags.pxcSize
          value: true
      - equal:
          path: spec.unsafeFlags.proxySize
          value: true

  - it: allows haproxy.size 1 when allowUnsafe is true
    set:
      pxc:
        enabled: true
        size: 3
        allowUnsafe: true
        haproxy:
          enabled: true
          size: 1
          image:
            repository: percona/haproxy
            tag: "2.8.5"
    asserts:
      - equal:
          path: spec.haproxy.size
          value: 1
      - equal:
          path: spec.unsafeFlags.pxcSize
          value: true
      - equal:
          path: spec.unsafeFlags.proxySize
          value: true

  - it: omits unsafeFlags when allowUnsafe is false
    set:
      pxc:
        enabled: true
        allowUnsafe: false
    asserts:
      - isNull:
          path: spec.unsafeFlags

  - it: sets initResources on PXC nodes
    set:
      pxc:
        enabled: true
        initResources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
    asserts:
      - equal:
          path: spec.pxc.initResources.requests.memory
          value: 128Mi
      - equal:
          path: spec.pxc.initResources.limits.memory
          value: 256Mi

  - it: includes backup when enabled
    set:
      pxc:
        enabled: true
        backup:
          enabled: true
          schedule: "0 4 * * *"
          storageType: s3
          s3Bucket: my-bucket
          s3CredentialsSecret: my-creds
          s3Region: us-west-2
    asserts:
      - isNotNull:
          path: spec.backup
