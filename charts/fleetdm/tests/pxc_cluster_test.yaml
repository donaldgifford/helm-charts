---
suite: pxc-cluster
templates:
  - templates/pxc-cluster.yaml
tests:
  - it: renders PerconaXtraDBCluster when pxc.enabled
    set:
      pxc:
        enabled: true
    asserts:
      - isKind:
          of: PerconaXtraDBCluster

  - it: does not render when pxc.enabled is false
    set:
      pxc:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: sets cluster name from pxc.clusterName
    set:
      pxc:
        enabled: true
        clusterName: my-pxc
    asserts:
      - equal:
          path: metadata.name
          value: my-pxc

  - it: sets pxc.size from values
    set:
      pxc:
        enabled: true
        size: 5
    asserts:
      - equal:
          path: spec.pxc.size
          value: 5

  - it: uses generated secret name by default
    set:
      pxc:
        enabled: true
        existingSecret: ""
    asserts:
      - equal:
          path: spec.secretsName
          value: RELEASE-NAME-fleetdm-pxc

  - it: uses existingSecret when set
    set:
      pxc:
        enabled: true
        existingSecret: my-pxc-secret
    asserts:
      - equal:
          path: spec.secretsName
          value: my-pxc-secret

  - it: enables haproxy by default
    set:
      pxc:
        enabled: true
    asserts:
      - equal:
          path: spec.haproxy.enabled
          value: true

  - it: includes ArgoCD server-side apply annotation
    set:
      pxc:
        enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "ServerSideApply=true"

  - it: omits backup when disabled
    set:
      pxc:
        enabled: true
        backup:
          enabled: false
    asserts:
      - isNull:
          path: spec.backup

  - it: includes backup when enabled
    set:
      pxc:
        enabled: true
        backup:
          enabled: true
          schedule: "0 4 * * *"
          storageType: s3
          s3Bucket: my-bucket
          s3CredentialsSecret: my-creds
          s3Region: us-west-2
    asserts:
      - isNotNull:
          path: spec.backup
