---
suite: valkey
templates:
  - templates/valkey.yaml
set:
  cache:
    existingSecret: "stub-redis-secret"
tests:
  - it: does not render when valkey.enabled is false
    set:
      valkey:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders StatefulSet and Service when enabled
    set:
      valkey:
        enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Service
        documentIndex: 0
      - isKind:
          of: StatefulSet
        documentIndex: 1

  - it: uses emptyDir by default
    set:
      valkey:
        enabled: true
        persistence:
          enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
        documentIndex: 1

  - it: uses PVC when persistence is enabled
    set:
      valkey:
        enabled: true
        persistence:
          enabled: true
          size: 5Gi
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 5Gi
        documentIndex: 1

  - it: includes requirepass when cache.usePassword is true
    set:
      valkey:
        enabled: true
      cache:
        usePassword: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "--requirepass"
        documentIndex: 1

  - it: omits requirepass when cache.usePassword is false
    set:
      valkey:
        enabled: true
      cache:
        usePassword: false
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].command
        documentIndex: 1

  - it: VALKEY_PASSWORD env references cache.existingSecret
    set:
      valkey:
        enabled: true
      cache:
        usePassword: true
        existingSecret: my-redis-creds
        passwordKey: redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-redis-creds
                key: redis-password
        documentIndex: 1

  - it: fails when cache.usePassword is true and existingSecret is empty
    set:
      valkey:
        enabled: true
      cache:
        usePassword: true
        existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "cache.existingSecret is required when cache.usePassword is true. The chart no longer generates a Redis Secret (see INV-0001 / IMPL-0003). Provision the Secret out-of-band (External Secrets, 1Password Operator, sealed-secrets, or raw kubectl apply)."
