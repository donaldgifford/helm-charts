---
suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: renders ServiceAccount when create is true
    set:
      serviceAccount:
        create: true
    asserts:
      - isKind:
          of: ServiceAccount

  - it: does not render when create is false
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: sets annotations from values
    set:
      serviceAccount:
        create: true
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::role/fleet
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::role/fleet

  - it: disables automount
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
