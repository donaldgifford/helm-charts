---
suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: renders MySQL secret when existingSecret is empty
    set:
      database:
        existingSecret: ""
      cache:
        usePassword: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-fleetdm-mysql
        documentIndex: 0

  - it: includes mysql-root-password key in MySQL secret
    set:
      database:
        existingSecret: ""
      cache:
        usePassword: false
    asserts:
      - exists:
          path: data.mysql-root-password
        documentIndex: 0

  - it: skips MySQL secret when existingSecret is set
    set:
      database:
        existingSecret: my-secret
      cache:
        usePassword: false
    asserts:
      - hasDocuments:
          count: 0

  - it: never renders a Redis Secret regardless of cache settings
    set:
      cache:
        usePassword: true
        existingSecret: my-redis
      database:
        existingSecret: my-db
    asserts:
      - hasDocuments:
          count: 0

  - it: never renders a Redis Secret when cache.usePassword is false
    set:
      cache:
        usePassword: false
      database:
        existingSecret: my-db
    asserts:
      - hasDocuments:
          count: 0

  - it: MySQL secret has resource-policy keep annotation
    set:
      database:
        existingSecret: ""
      cache:
        usePassword: false
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 0
