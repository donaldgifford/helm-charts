---
suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: renders MySQL secret when existingSecret is empty
    set:
      database:
        existingSecret: ""
      cache:
        usePassword: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-fleetdm-mysql
        documentIndex: 0

  - it: includes mysql-root-password key in MySQL secret
    set:
      database:
        existingSecret: ""
      cache:
        usePassword: false
    asserts:
      - exists:
          path: data.mysql-root-password
        documentIndex: 0

  - it: skips MySQL secret when existingSecret is set
    set:
      database:
        existingSecret: my-secret
      cache:
        usePassword: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Redis secret when cache.usePassword and no existingSecret
    set:
      cache:
        usePassword: true
        existingSecret: ""
      database:
        existingSecret: my-db
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-fleetdm-redis
        documentIndex: 0

  - it: skips Redis secret when cache.existingSecret is set
    set:
      cache:
        usePassword: true
        existingSecret: my-redis
      database:
        existingSecret: my-db
    asserts:
      - hasDocuments:
          count: 0

  - it: renders both secrets with default values
    set:
      cache:
        usePassword: true
    asserts:
      - hasDocuments:
          count: 2

  - it: all secrets have resource-policy keep annotation
    set:
      cache:
        usePassword: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 1
