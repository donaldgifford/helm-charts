---
suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: renders MySQL secret when existingSecret is empty
    set:
      database:
        existingSecret: ""
      pxc:
        enabled: false
      cache:
        usePassword: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-fleetdm-mysql
        documentIndex: 0

  - it: skips MySQL secret when existingSecret is set
    set:
      database:
        existingSecret: my-secret
      pxc:
        enabled: false
      cache:
        usePassword: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders PXC secret when pxc.enabled and no existingSecret
    set:
      pxc:
        enabled: true
        existingSecret: ""
      database:
        existingSecret: my-db
      cache:
        usePassword: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-fleetdm-pxc
        documentIndex: 0

  - it: skips PXC secret when pxc.existingSecret is set
    set:
      pxc:
        enabled: true
        existingSecret: my-pxc-secret
      database:
        existingSecret: my-db
      cache:
        usePassword: false
    asserts:
      - hasDocuments:
          count: 0

  - it: skips PXC secret when pxc.enabled is false
    set:
      pxc:
        enabled: false
      database:
        existingSecret: my-db
      cache:
        usePassword: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Redis secret when cache.usePassword and no existingSecret
    set:
      cache:
        usePassword: true
        existingSecret: ""
      database:
        existingSecret: my-db
      pxc:
        enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-fleetdm-redis
        documentIndex: 0

  - it: skips Redis secret when cache.existingSecret is set
    set:
      cache:
        usePassword: true
        existingSecret: my-redis
      database:
        existingSecret: my-db
      pxc:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders all three secrets with default values
    set:
      pxc:
        enabled: true
      cache:
        usePassword: true
    asserts:
      - hasDocuments:
          count: 3

  - it: all secrets have resource-policy keep annotation
    set:
      pxc:
        enabled: true
      cache:
        usePassword: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 2
