---
# CI test values: HA configuration with Valkey, autoscaling, PDB, Ingress
# Embedded MySQL disabled (external stub), HTTPRoute disabled (no Gateway API CRDs)
mysql:
  enabled: false

valkey:
  enabled: true
  persistence:
    enabled: false

database:
  address: "mysql-stub:3306"
  existingSecret: fleet-mysql-stub

cache:
  usePassword: true
  existingSecret: fleet-redis-stub

httpRoute:
  enabled: false

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: fleet.example.com
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
