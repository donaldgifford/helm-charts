{{- if not .Values.database.existingSecret }}
{{- $secretName := printf "%s-mysql" (include "fleetdm.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existingSecret }}
  {{ .Values.database.passwordKey }}: {{ index $existingSecret.data .Values.database.passwordKey }}
  mysql-root-password: {{ index $existingSecret.data "mysql-root-password" }}
  {{- else }}
  {{ .Values.database.passwordKey }}: {{ randAlphaNum 32 | b64enc | quote }}
  mysql-root-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- /*
  Redis/Valkey Secret rendering was removed in chart 0.4.4. The chart
  previously used a lookup+randAlphaNum fallback that regenerated the
  password on every render under `helm template`, breaking ArgoCD,
  kustomize helmCharts, and helmfile users. See INV-0001 / IMPL-0003.
  When cache.usePassword is true, cache.existingSecret is now required.
*/}}
