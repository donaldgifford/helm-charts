{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetdm.fullname" . }}-mysql
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.database.passwordKey }}: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- if and .Values.pxc.enabled (not .Values.pxc.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetdm.fullname" . }}-pxc
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  root: {{ randAlphaNum 32 | b64enc | quote }}
  xtrabackup: {{ randAlphaNum 32 | b64enc | quote }}
  monitor: {{ randAlphaNum 32 | b64enc | quote }}
  clustercheck: {{ randAlphaNum 32 | b64enc | quote }}
  proxyadmin: {{ randAlphaNum 32 | b64enc | quote }}
  pmmserver: {{ randAlphaNum 32 | b64enc | quote }}
  operator: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- if and .Values.cache.usePassword (not .Values.cache.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetdm.fullname" . }}-redis
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.cache.passwordKey }}: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
