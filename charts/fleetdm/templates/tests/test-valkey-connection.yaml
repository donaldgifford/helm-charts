{{- if or .Values.valkey.enabled .Values.cache.address }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fleetdm.fullname" . }}-test-valkey
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
  containers:
    - name: valkey-test
      image: valkey/valkey:{{ .Values.valkey.image.tag }}
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          {{- if .Values.cache.usePassword }}
          valkey-cli -u "redis://:${REDIS_PASSWORD}@{{ include "fleetdm.redisAddress" . }}" PING
          {{- else }}
          valkey-cli -h "{{ include "fleetdm.redisAddress" . }}" PING
          {{- end }}
      {{- if .Values.cache.usePassword }}
      env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fleetdm.redisSecretName" . }}
              key: {{ .Values.cache.passwordKey }}
      {{- end }}
{{- end }}
