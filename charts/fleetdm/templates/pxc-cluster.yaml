{{- if .Values.pxc.enabled }}
---
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: {{ .Values.pxc.clusterName }}
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: "ServerSideApply=true"
spec:
  crVersion: "1.15.0"
  secretsName: {{ include "fleetdm.pxcSecretName" . }}
  pxc:
    size: {{ .Values.pxc.size }}
    image: "{{ .Values.pxc.image.repository }}:{{ .Values.pxc.image.tag }}"
    {{- with .Values.pxc.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    volumeSpec:
      persistentVolumeClaim:
        {{- if .Values.pxc.storage.storageClassName }}
        storageClassName: {{ .Values.pxc.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.pxc.storage.size }}
  {{- if .Values.pxc.haproxy.enabled }}
  haproxy:
    enabled: true
    size: {{ .Values.pxc.haproxy.size }}
    image: "{{ .Values.pxc.haproxy.image.repository }}:{{ .Values.pxc.haproxy.image.tag }}"
    {{- with .Values.pxc.haproxy.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .Values.pxc.backup.enabled }}
  backup:
    schedule:
      - name: daily-backup
        schedule: {{ .Values.pxc.backup.schedule | quote }}
        keep: 5
        storageName: {{ .Values.pxc.backup.storageType }}
    storages:
      {{ .Values.pxc.backup.storageType }}:
        type: {{ .Values.pxc.backup.storageType }}
        {{- if eq .Values.pxc.backup.storageType "s3" }}
        s3:
          bucket: {{ .Values.pxc.backup.s3Bucket }}
          credentialsSecret: {{ .Values.pxc.backup.s3CredentialsSecret }}
          region: {{ .Values.pxc.backup.s3Region }}
        {{- end }}
  {{- end }}
{{- end }}
