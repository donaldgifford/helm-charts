{{- if .Values.pxc.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fleetdm.fullname" . }}-mysql-init
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "fleetdm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mysql-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: mysql-init
          image: "{{ .Values.pxc.initJob.image.repository }}:{{ .Values.pxc.initJob.image.tag }}"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              set -e
              MYSQL_HOST="{{ .Values.pxc.clusterName }}-haproxy.{{ .Release.Namespace }}"

              echo "Waiting for PXC to be ready..."
              until mysqladmin ping -h "$MYSQL_HOST" -u root -p"$MYSQL_ROOT_PASSWORD" --connect-timeout=5 2>/dev/null; do
                echo "PXC not ready, retrying in 5s..."
                sleep 5
              done

              echo "Creating database and user..."
              mysql -h "$MYSQL_HOST" -u root -p"$MYSQL_ROOT_PASSWORD" <<EOF
              CREATE DATABASE IF NOT EXISTS \`$FLEET_DB_NAME\`;
              CREATE USER IF NOT EXISTS '$FLEET_DB_USER'@'%' IDENTIFIED BY '$FLEET_DB_PASSWORD';
              GRANT ALL PRIVILEGES ON \`$FLEET_DB_NAME\`.* TO '$FLEET_DB_USER'@'%';
              FLUSH PRIVILEGES;
              EOF

              echo "MySQL init complete — database '$FLEET_DB_NAME' and user '$FLEET_DB_USER' ready."
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleetdm.pxcSecretName" . }}
                  key: root
            - name: FLEET_DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: FLEET_DB_USER
              value: {{ .Values.database.username | quote }}
            - name: FLEET_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleetdm.mysqlSecretName" . }}
                  key: {{ .Values.database.passwordKey }}
{{- end }}
