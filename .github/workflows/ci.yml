---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Check for charts
        id: check
        run: |
          if ls charts/*/Chart.yaml 1>/dev/null 2>&1; then
            echo "has_charts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_charts=false" >> "$GITHUB_OUTPUT"
            echo "No charts found, skipping lint"
          fi

      - name: Lint charts
        if: steps.check.outputs.has_charts == 'true'
        run: helm lint charts/*

  helm-unittest:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install helm-unittest plugin
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest

      - name: Check for charts with tests
        id: check
        run: |
          if ls charts/*/tests/*_test.yaml 1>/dev/null 2>&1; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No unit tests found, skipping"
          fi

      - name: Run unit tests
        if: steps.check.outputs.has_tests == 'true'
        run: helm unittest charts/*

  helm-docs:
    name: Helm Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install helm-docs
        run: |
          curl -sSL https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz \
            | tar xz helm-docs && sudo mv helm-docs /usr/local/bin/

      - name: Check for charts
        id: check
        run: |
          if ls charts/*/Chart.yaml 1>/dev/null 2>&1; then
            echo "has_charts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_charts=false" >> "$GITHUB_OUTPUT"
            echo "No charts found, skipping docs check"
          fi

      - name: Check docs are up to date
        if: steps.check.outputs.has_charts == 'true'
        run: |
          helm-docs --chart-search-root charts
          if ! git diff --exit-code; then
            echo "::error::helm-docs are out of date. Run 'make helm-docs' and commit."
            exit 1
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Check for charts
        id: check
        run: |
          if ls charts/*/Chart.yaml 1>/dev/null 2>&1; then
            echo "has_charts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_charts=false" >> "$GITHUB_OUTPUT"
            echo "No charts found, skipping manifest scan"
          fi

      - name: Render and scan manifests
        if: steps.check.outputs.has_charts == 'true'
        run: |
          mkdir -p /tmp/rendered
          for chart in charts/*/; do
            name=$(basename "$chart")
            for vals in "$chart"ci/*.yaml; do
              [ -f "$vals" ] || continue
              vname=$(basename "$vals" .yaml)
              helm template "$name" "$chart" -f "$vals" > "/tmp/rendered/${name}-${vname}.yaml"
            done
          done

  chart-version-check:
    name: Chart Version Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Check chart version bumped when files change
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0

          for chart_yaml in charts/*/Chart.yaml; do
            [ -f "$chart_yaml" ] || continue
            chart_dir=$(dirname "$chart_yaml")
            chart_name=$(basename "$chart_dir")

            # Check if any files in this chart dir changed (excluding Chart.yaml itself)
            changed=$(git diff --name-only "$base" "$head" -- "$chart_dir" | grep -v 'Chart\.yaml$' || true)
            if [ -z "$changed" ]; then
              echo "✓ $chart_name — no file changes"
              continue
            fi

            # Check if Chart.yaml version field changed
            old_version=$(git show "${base}:${chart_yaml}" 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
            new_version=$(grep '^version:' "$chart_yaml" | awk '{print $2}')

            if [ "$old_version" = "$new_version" ]; then
              echo "::error::Chart '$chart_name' has file changes but version is still $new_version. Bump the version in $chart_yaml."
              failed=1
            else
              echo "✓ $chart_name — version bumped $old_version → $new_version"
            fi
          done

          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

  renovate-validate:
    name: Validate Renovate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate Renovate config
        uses: suzuki-shunsuke/github-action-renovate-config-validator@v2.1.0
        with:
          config_file_path: renovate.json5

  chart-test:
    name: Chart Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Lint charts
        run: ct lint --config ct.yaml --all

      - name: Detect changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

        # ct install is disabled until charts can run in Kind without external
        # dependencies (PXC operator, real MySQL, etc). ct lint covers template
        # rendering and schema validation. Full e2e is done manually.
        # - name: Create kind cluster
        #   if: steps.list-changed.outputs.changed == 'true'
        #   uses: helm/kind-action@v1
        #
        # - name: Install and test charts
        #   if: steps.list-changed.outputs.changed == 'true'
        #   run: ct install --config ct.yaml
